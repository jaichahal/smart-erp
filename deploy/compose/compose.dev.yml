# Development overrides (Apple Silicon Mac, Docker Desktop with 6 CPUs / 8 GB).
# Applied through COMPOSE_FILE=docker-compose.yml:compose.dev.yml in .env.
#
# Only resource limits, dev-only bootstrap, and dev conveniences belong here.
# The stack idles around 3 GB and peaks near 5 GB with Chromium rendering
# (spec 10, "Local stack"); limits below keep a runaway service from starving
# the agents' editors and Go builds.

services:
  postgres:
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "2"

  valkey:
    deploy:
      resources:
        limits:
          memory: 256M

  minio:
    deploy:
      resources:
        limits:
          memory: 768M

  minio-init:
    environment:
      # Dev-only local off-site simulation bucket, object-locked like the real
      # off-site bucket so the anchor/backup code paths are exercised daily.
      EXTRA_BUCKETS: offsite-sim
      ERP_ANCHOR_RETENTION: 1d

  zitadel:
    deploy:
      resources:
        limits:
          memory: 768M

  caddy:
    deploy:
      resources:
        limits:
          memory: 128M

  headless-shell:
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "2"

  mailpit:
    deploy:
      resources:
        limits:
          memory: 128M

  otel-collector:
    deploy:
      resources:
        limits:
          memory: 256M

  api:
    deploy:
      resources:
        limits:
          memory: 512M

  worker:
    deploy:
      resources:
        limits:
          memory: 512M

  scheduler:
    deploy:
      resources:
        limits:
          memory: 256M

  pushsink:
    deploy:
      resources:
        limits:
          memory: 128M
