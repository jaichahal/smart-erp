              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [id]
                    properties:
                      id:
                        type: string
                  meta:
                    $ref: "#/components/schemas/Meta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /audit/verify:
    post:
      operationId: verifyAuditChain
      tags: [audit]
      summary: Walk the audit chain and report the first break
      description: |
        Auditor and System Manager only. Recomputes every hash, compares each `prev_hash` to the
        previous stored hash and the recomputed head to the anchored head (B6, B7, B11).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/ChainVerification"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /audit/events:
    get:
      operationId: listAuditEvents
      tags: [audit]
      summary: Query audit events
      parameters:
        - name: ref
          in: query
          description: Document or entity reference (id or number) the event is about
