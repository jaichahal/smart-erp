        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Notification page
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [items]
                    properties:
                      items:
