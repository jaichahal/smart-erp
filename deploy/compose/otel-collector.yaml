# OpenTelemetry Collector, development configuration.
# Receives OTLP from api/worker/scheduler and writes to stdout (debug) and to
# /var/log/otel/traces.json on the otel-logs volume:
#   docker compose exec otel-collector cat /var/log/otel/traces.json | jq .

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 192
    spike_limit_mib: 48
  batch:
    timeout: 2s
    send_batch_size: 512
  resource:
    attributes:
      - key: deployment.environment
        value: dev
        action: upsert

exporters:
  debug:
    verbosity: basic
    sampling_initial: 5
    sampling_thereafter: 200
  file:
    path: /var/log/otel/traces.json
    rotation:
      max_megabytes: 50
      max_backups: 3
    format: json

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [health_check, zpages]
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [debug, file]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [debug, file]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [debug, file]
