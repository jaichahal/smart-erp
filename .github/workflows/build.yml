# build: multi-arch container images for every Go command, pushed to GHCR.
# Runs on pushes to main and on release tags v*. Never on pull requests (no registry write).
# Images: ghcr.io/jaichahal/smart-erp/{api,worker,scheduler,migrate,pushsink}
# Both linux/amd64 (the NUC) and linux/arm64 (the development Mac) per docs/spec/10 and test I10.

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write # keyless provenance attestation (docker/build-push-action provenance: true)
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/jaichahal/smart-erp

jobs:
  image:
    name: image (${{ matrix.cmd }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        cmd: [api, worker, scheduler, migrate, pushsink]
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags:
      #   always      sha-<short sha>
      #   main        latest
      #   tags v*     <tag>  (e.g. v1.2.3) and semver major.minor
      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}/${{ matrix.cmd }}
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=smart-erp ${{ matrix.cmd }}
            org.opencontainers.image.vendor=Smart ERP Owner
            org.opencontainers.image.licenses=LicenseRef-Proprietary

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          build-args: |
            CMD=${{ matrix.cmd }}
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.cmd }}
          cache-to: type=gha,scope=${{ matrix.cmd }},mode=max

      # Pinned digests are what deploy/compose references (docs/spec/07 P1.13).
      - name: Record digest
        run: |
          set -euo pipefail
          mkdir -p dist
          echo "${IMAGE_BASE}/${{ matrix.cmd }}@${{ steps.build.outputs.digest }}" | tee "dist/${{ matrix.cmd }}.digest"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.cmd }}
          path: dist/${{ matrix.cmd }}.digest

  # Optional: an independent SBOM of the pushed image (in addition to the buildkit attestation).
  image-sbom:
    name: image sbom (${{ matrix.cmd }})
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        cmd: [api, worker, scheduler, migrate, pushsink]
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: digest-${{ matrix.cmd }}
          path: dist

      - name: Resolve image reference
        id: ref
        run: echo "image=$(cat dist/${{ matrix.cmd }}.digest)" >> "$GITHUB_OUTPUT"

      - name: syft (spdx-json)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.ref.outputs.image }}
          format: spdx-json
          artifact-name: sbom-image-${{ matrix.cmd }}.spdx.json
          output-file: sbom-image-${{ matrix.cmd }}.spdx.json
          upload-artifact: true
          upload-release-assets: false

  # Collect every digest into one file so a deploy PR can pin compose in one step.
  digests:
    name: digests summary
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: dist
      - name: Summary
        run: |
          {
            echo "## Pushed images"
            echo
            echo '```'
            cat dist/*.digest
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: image-digests
          path: dist/*.digest
