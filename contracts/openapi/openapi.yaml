openapi: 3.1.0
info:
  title: Smart ERP API
  version: 1.1.0
  summary: Machine form of docs/spec/04-api-contracts.md
  description: |
    Seeded from `docs/spec/04-api-contracts.md` version 1.1.0. That file is the human form and
    wins on conflict until this document is regenerated. Additive changes bump the minor version;
    breaking changes bump the major version and carry a migration note.

    1.1.0 (additive): `GET /me/sessions` and `DELETE /me/sessions/{id}` plus schema `UserSession`
    (R1.15, A9). No breaking change from 1.0.0.
    1.1.0 adds the Journeys paths, the step result shape, and no change to existing operations.
    1.1.0 is additive: period soft-close, hard-close, audit-adjustment open, and the holiday
    calendar. No field or path was removed. Clients ignore the new `period.closed` event type
    until they understand it.

    Transport rules that apply to every operation:

    - JSON over HTTPS. All timestamps are UTC ISO 8601. Money is `{ amount, currency }` with the
      amount as a decimal string.
    - Every success response is `{ data, meta }`. Every failure, including 429 and gateway errors,
      is `{ error: { code, message, details, request_id } }`.
    - Every mutating request accepts `Idempotency-Key` (UUID); the server replays a stored response
      for 24 hours; a different body with the same key is `409 CONFLICT`.
    - Every mutable resource carries `state_version`; mutating requests send `If-Match`; a mismatch
      is `409 CONFLICT` with the current state in `error.details`.
    - `Accept-Language: en | ar` affects messages and print formats, never data.
  contact:
    name: Smart ERP contract owner
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  x-spec-source: docs/spec/04-api-contracts.md

servers:
  - url: /api/v1
    description: Same origin as the console; mobile clients use https://api.<domain>/api/v1

security:
  - bearer: []
    dpop: []

tags:
  - name: system
    description: Health and operator status
  - name: identity
    description: Session brokering to Zitadel, token issuance, device binding, step-up
  - name: approvals
    description: Approval inbox and decisions
  - name: devices
    description: Push token lifecycle
  - name: notifications
    description: Inbox, preferences, WebSocket, and alert rules
  - name: audit
    description: Audit chain verification and event query
  - name: authz
    description: Segregation of duties and the approval matrix (R1.13, R2.2). Roles themselves are data, not a new route.
  - name: journeys
    description: Persona-filtered journey definitions, instances, and the step protocol
  - name: periods
    description: Fiscal period soft close, hard close, and the audit-adjustment period
  - name: masters
    description: Company masters, including the holiday calendar

paths:
  /health:
    get:
      operationId: getHealth
      tags: [system]
      summary: Readiness probe
      description: Public. Returns 200 when the API can serve traffic; 503 otherwise.
      security: []
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/HealthResponse"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /status:
    get:
      operationId: getStatus
      tags: [system]
      summary: Operator status page data
      description: |
        System Manager only (A20). Last backup, last chain verification, last bank feed, queue
        depth, worker health, clock drift and which recovery point is in force (I16).
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/StatusResponse"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /auth/session:
    post:
      operationId: createAuthSession
      tags: [identity]
      summary: Start a login session
      description: |
        Brokered to Zitadel's Session API; clients never call Zitadel directly (R1.3). Every
        failure path returns a byte-identical body and status regardless of cause (A1, R1.7).
        Rate limited per user and per IP with the standard envelope (A7, R1.8).
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login_name]
              properties:
                login_name:
                  type: string
                  minLength: 1
                  maxLength: 254
      responses:
        "200":
          description: Session created; challenges to satisfy
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/AuthSession"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /auth/session/{id}/check:
    post:
      operationId: checkAuthSession
      tags: [identity]
      summary: Advance a login session by one or more factors
      description: |
        Verifies password, TOTP or WebAuthn assertion against the session. MFA-mandatory roles
        cannot complete without a second factor (A10). Failures are indistinguishable (A1).
      security: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                password:
                  type: string
                totp:
                  type: string
                  pattern: "^[0-9]{6,8}$"
                webauthn_assertion:
                  type: object
                  description: WebAuthn assertion as produced by the platform authenticator
                  additionalProperties: true
      responses:
        "200":
          description: Factor state after this check
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/AuthSession"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /auth/token:
    post:
      operationId: issueToken
      tags: [identity]
      summary: Exchange a verified session and enrolled device for ERP tokens
      description: |
        Issued by the ERP token issuer with KMS-held signing keys (R1.3). Access tokens live 15
        minutes or less; refresh tokens are bound to the device key (R1.4, R1.5). A proof from a
        device other than the enrolled one is `DEVICE_MISMATCH` (A3).
      security:
        - dpop: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, device_id]
              properties:
                session_id:
                  type: string
                device_id:
                  type: string
      responses:
        "200":
          description: Tokens issued
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/TokenResponse"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [identity]
      summary: Rotate the refresh token and issue a new access token
      description: |
        Refresh tokens rotate on use. A reused refresh token revokes the device and every token
        issued to it (A4, R1.5).
      security:
        - dpop: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        "200":
          description: Rotated
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/TokenResponse"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /auth/logout:
    post:
      operationId: logout
      tags: [identity]
      summary: End the current session
      description: Revokes the device refresh token and unregisters the device's push token.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/Empty"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /auth/step-up:
    post:
      operationId: stepUp
      tags: [identity]
      summary: Obtain a single-use step-up token for one action
      description: |
        Required for approvals at or above threshold, payment release, bank changes, corrections
        and break-glass (R1.6, D14). The token is single-use and expires in two minutes (A6).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method, code]
              properties:
                method:
                  type: string
                  enum: [totp, webauthn, biometric]
                code:
                  type: string
                  description: TOTP code, or the serialised assertion for webauthn and biometric
      responses:
        "200":
          description: Step-up token
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [step_up_token, expires_in]
                    properties:
                      step_up_token:
                        type: string
                      expires_in:
                        type: integer
                        description: Seconds until expiry; at most 120
                        maximum: 120
                  meta:
                    $ref: "#/components/schemas/Meta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /auth/device/enroll:
    post:
      operationId: enrollDevice
      tags: [identity]
      summary: Enrol a device public key
      description: |
        The device generates a key pair in Android Keystore or iOS Secure Enclave and sends the
        public key; the server stores it and binds later tokens to it (R1.4).
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [public_key, platform, app_version, device_name]
              properties:
                public_key:
                  type: object
                  description: JWK of the device public key (EC P-256 or RSA)
                  additionalProperties: true
                platform:
                  $ref: "#/components/schemas/Platform"
                app_version:
                  type: string
                device_name:
                  type: string
                  maxLength: 120
      responses:
        "201":
          description: Enrolled
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [device_id]
                    properties:
                      device_id:
                        type: string
                  meta:
                    $ref: "#/components/schemas/Meta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /me:
    get:
      operationId: getMe
      tags: [identity]
      summary: Current user
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/User"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /me/sessions:
    get:
      operationId: listMySessions
      tags: [identity]
      summary: List the current user's sessions
      description: |
        Sessions are capped per user and listable (R1.15, A22). Ending one from another device
        stops that device's next request (A9).
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserSession"
                  meta:
                    $ref: "#/components/schemas/PageMeta"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /me/sessions/{id}:
    delete:
      operationId: endMySession
      tags: [identity]
      summary: End a session
      description: |
        The session owner or a System Manager ends the session (R1.15). Revocation takes effect
        on the next request from that device (A9, R1.5).
      parameters:
        - $ref: "#/components/parameters/UserSessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/Empty"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /approvals/inbox:
    get:
      operationId: listApprovalInbox
      tags: [approvals]
      summary: Approval inbox cards
      description: Cards for the authenticated approver, filtered by state (R2.10 fraud hints included).
      parameters:
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum: [needs_me, waiting_on_others, fyi]
            default: needs_me
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Cards
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApprovalCard"
                  meta:
                    $ref: "#/components/schemas/PageMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /approvals/{id}:
    get:
      operationId: getApproval
      tags: [approvals]
      summary: Live view of one approval request
      description: Includes the document snapshot at submission and its content hash (R2.11).
      parameters:
        - $ref: "#/components/parameters/ApprovalId"
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Approval request
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/ApprovalDetail"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /approvals/{id}/approve:
    post:
      operationId: approveApproval
      tags: [approvals]
      summary: Approve
      description: |
        Serialised per request with a row lock and state version (R2.6). A concurrent second
        decision receives 200 with the decided state and `ALREADY_DECIDED` in `meta.notice`, not an
        error (D7). Step-up required at or above threshold (D14).
      parameters:
        - $ref: "#/components/parameters/ApprovalId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state_version]
              properties:
                comment:
                  type: string
                  maxLength: 2000
                state_version:
                  $ref: "#/components/schemas/StateVersion"
                step_up_token:
                  type: string
      responses:
        "200":
          description: Decision recorded, or already decided
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/ApprovalDecision"
                  meta:
                    $ref: "#/components/schemas/DecisionMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /approvals/{id}/reject:
    post:
      operationId: rejectApproval
      tags: [approvals]
      summary: Reject
      description: An empty or whitespace reason is `400 VALIDATION_ERROR` (R2.4, D5).
      parameters:
        - $ref: "#/components/parameters/ApprovalId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, state_version]
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  pattern: "\\S"
                state_version:
                  $ref: "#/components/schemas/StateVersion"
      responses:
        "200":
          description: Decision recorded, or already decided
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/ApprovalDecision"
                  meta:
                    $ref: "#/components/schemas/DecisionMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /devices/push-token:
    post:
      operationId: registerPushToken
      tags: [devices]
      summary: Register the push token for the current device
      description: Idempotent; bound to the session user and device (R13.6).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, platform, app_version]
              properties:
                token:
                  type: string
                platform:
                  $ref: "#/components/schemas/Platform"
                app_version:
                  type: string
      responses:
        "200":
          description: Registered
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/Empty"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: deletePushToken
      tags: [devices]
      summary: Unregister the push token for the current device
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Unregistered
          content:
            application/json:
              schema:
                type: object
