      responses:
        "200":
          description: Preferences
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/NotificationPreferences"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
    put:
      operationId: putNotificationPreferences
      tags: [notifications]
      summary: Replace notification preferences
      description: Quiet hours never suppress Critical (E6). Preferences never delete audit rows (R13.2).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPreferences"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/Empty"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /ws:
    get:
      operationId: subscribeEvents
      tags: [notifications]
      summary: WebSocket subscription for the authenticated user
      description: |
        Upgrades to WebSocket. The server pushes `{ event_id, type, payload, at }`.
        The client acks with `{ ack: event_id }`. An ack clears the item on every
        connected surface within one second while online (E9, R13.5).
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "101":
          description: Switching Protocols
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
