                    $ref: "#/components/schemas/PageMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /notifications/{event_id}/acknowledge:
    post:
      operationId: acknowledgeNotification
      tags: [notifications]
      summary: Acknowledge a notification and clear it on every surface
      description: Clears the item for the caller and pushes `notification.cleared` to every connected surface (E9, R13.5).
      parameters:
